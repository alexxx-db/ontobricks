# The values Seiji reads for this package, set per label in its config.
config:
  _:
    hello_abacus_enabled_workspaces:
      default: []
      description: "Workspaces to deploy the hello-abacus app to."
      required: true
      tfvar: true
      type: list
  nextgen.datasolutions.hello_abacus:
    app_tag:
      description: "CI tag of the artifact published to s3://abacus-artifacts-kitchen/databricks-apps/hello-abacus/<tag>/. An earlier tag rolls back."
      required: true
      tfvar: true
      type: str
